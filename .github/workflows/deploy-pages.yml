name: Deploy Academy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify learning and reward rules
        run: |
          node --check paths.js
          node --check path-model.js
          node --check app.js
          node --check auth.js
          node --check assessment.js
          node --check credential-art.js
          node --check full-name.js
          node --check admin.js
          node --check experience.js
          node --check billing-checkout.js
          node --check functions/academy-progress/src/billing.js
          node --check membership.js
          node --check journey.js
          node --check labs.js
          node --check lab.js
          node --check catalog.js
          node --check desktop.js
          node --check pilot.js
          node --check pilot-model.js
          node --check cloud-dfir-lab.js
          node --check cloud-dfir-model.js
          node --check authorization-lab.js
          node --check authorization-model.js
          node --check workbench.js
          node --check lesson-notes.js
          node --check workbench-model.js
          node --check path-assessment.js
          node --check course-assessment.js
          node --check practical-assessment.js
          node --check plan-access.js
          node --check functions/academy-progress/src/library.js
          node --check functions/academy-progress/src/path-exam.js
          node --check functions/academy-progress/src/course-exam.js
          node --check functions/academy-progress/src/practical.js
          node --check functions/academy-progress/src/main.js
          node --check functions/academy-progress/src/name.js
          node --check functions/academy-progress/src/exam.js
          node --check functions/academy-progress/src/admin.js
          node --check functions/academy-progress/src/coins.js
          node --check functions/academy-progress/src/membership.js
          node scripts/content-release.mjs verify
          node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          mkdir -p _site/assets _site/content
          cp index.html paths.html path.html paths.js paths.css path-model.js path-catalog-data.js challenges.html progress.html membership.html course.html lesson.html exam.html path-exam.html course-exam.html practical.html certificate.html admin.html lab.html courses.html labs.html quizzes.html tools.html shop.html review.html pilot.html pilot.js pilot-model.js operations.html operation.html certifications.html professional.html notes.html favorites.html search.html settings.html profile.html library-course.html library-lesson.html practice-quiz.html practice-lab.html practice-challenge.html style.css experience.css experience.js billing-checkout.js app.js auth.js assessment.js credential-art.js full-name.js path-assessment.js course-assessment.js practical-assessment.js admin.js membership.js journey.js labs.js lab.js catalog.js desktop.js cloud-dfir-lab.js cloud-dfir-model.js authorization-lab.js authorization-model.js workbench.js workbench-model.js lesson-notes.js identity.js profile.js assessment-ui.js plan-access.js content.js content-en.js learning-content.js i18n.js engine.js robots.txt sitemap.xml _site/
          cp assets/* _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
