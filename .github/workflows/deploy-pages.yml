name: Deploy Academy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify learning and reward rules
        run: |
          node --check app.js
          node --check auth.js
          node --check assessment.js
          node --check admin.js
          node --check functions/academy-progress/src/main.js
          node --check functions/academy-progress/src/exam.js
          node --check functions/academy-progress/src/admin.js
          node scripts/content-release.mjs verify
          node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          mkdir -p _site/assets
          cp index.html paths.html challenges.html progress.html course.html lesson.html exam.html certificate.html admin.html style.css app.js auth.js assessment.js admin.js content.js content-en.js learning-content.js i18n.js engine.js robots.txt sitemap.xml _site/
          cp assets/* _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
